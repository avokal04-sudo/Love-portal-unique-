<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>For You 💖</title>
    <style>
        body {
            background: black;
            color: pink;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 100px;
        }
        h1 { font-size: 3rem; text-shadow: 0 0 20px #ff69b4; }
        input {
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            margin-top: 20px;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 20px;
            border: none;
            background: #ff69b4;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 15px #ff1493;
        }
        button:hover { background: #ff1493; }
    </style>
</head>
<body>
    <h1>💖 Welcome, My Love</h1>
    <p>Enter the secret code to see your surprise</p>
    <input type="password" id="pass" placeholder="Password...">
    <br>
    <button onclick="check()">Unlock</button>

    <script>
        function check() {
            let p = document.getElementById("pass").value;
            if (p === "maki19") {
                window.location.href = "unlock.html";
            } else {
                alert("Wrong password 💔");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: black;
            color: pink;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 100px;

        h1 { font-size: 2.5rem; }

        function check() {
            let p = document.getElementById("pass").value;

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ❤️</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .photo-frame {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .photo-frame.locked img {
            filter: blur(15px) brightness(0.7);
            transition: filter 0.5s ease;
        }

        .photo-frame:not(.locked) img {
            filter: blur(0) brightness(1);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: 50%;
            transition: opacity 0.5s;
        }

        .lock-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .typing-area {
            position: relative;
            margin-bottom: 5px;
        }

        #secretInput {
            background: rgba(255,255,255,0.3);
            border: none;
            border-bottom: 2px solid white;
            font-size: 20px;
            padding: 5px 10px;
            color: white;
            text-align: center;
            outline: none;
            width: 150px;
            letter-spacing: 3px;
            caret-color: white;
        }
        #secretInput::placeholder {
            color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
            font-size: 14px;
        }

        .typed-letters {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px #d63384;
            letter-spacing: 4px;
            pointer-events: none;
        }

        .unlock-hint {
            color: white;
            font-size: 12px;
            margin-top: 5px;
            text-shadow: 1px 1px 2px black;
        }

        .photo-frame:not(.locked) .lock-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .message {
            margin-top: 30px;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 2;
            min-height: 3em;
        }

        .btn-surprise {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff6b81;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            z-index: 3;
        }
        .btn-surprise:hover { transform: scale(1.1); }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="photo-frame locked" id="photoFrame">
        <!-- 🔽 PUT YOUR GIRLFRIEND'S PHOTO FILENAME HERE -->
        <img src="love..jpg" alt="Birthday Girl" id="profilePic">
        <div class="lock-overlay" id="lockOverlay">
            <div class="lock-icon" id="lockIcon">🔒</div>
            <div class="typing-area">
                <input type="text" id="secretInput" maxlength="10" placeholder="type the word..." autocomplete="off">
                <div class="typed-letters" id="typedDisplay"></div>
            </div>
            <p class="unlock-hint">Type the secret word to unlock</p>
        </div>
    </div>

    <div class="message" id="typewriter"></div>
    <button class="btn-surprise" onclick="burstConfetti()">🎂 Happy Birthday 🎂</button>
    <div class="hearts-container" id="hearts-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <script>
        // ====== UNLOCK WITH SECRET WORD ======
        const secretWord = "love";   // <-- Change to any word you like (lowercase)
        let typedWord = "";
        const inputField = document.getElementById('secretInput');
        const typedDisplay = document.getElementById('typedDisplay');
        const lockOverlayEl = document.getElementById('lockOverlay');
        const photoFrameEl = document.getElementById('photoFrame');
        const lockIcon = document.getElementById('lockIcon');

        window.addEventListener('load', () => {
            inputField.focus();
        });

        inputField.addEventListener('input', (e) => {
            const currentInput = e.target.value.toLowerCase();
            typedWord = currentInput;
            typedDisplay.textContent = typedWord;

            if (typedWord === secretWord) {
                photoFrameEl.classList.remove('locked');
                lockIcon.textContent = '❤️';
                typedDisplay.textContent = '❤️❤️❤️';
                setTimeout(() => {
    lockOverlayEl.style.display = 'none';
}, 600);
// Show the cake!
const cakeContainer = document.getElementById('cakeContainer');
if (cakeContainer) {
    setTimeout(() => {
        cakeContainer.classList.add('show');
    }, 400);
}
burstConfetti();
            }
        });

        // ====== TYPEWRITER ======
        const message = "Happy Birthday, my love! ❤️";
        const speed = 100;
        let i = 0;
        const typewriterEl = document.getElementById('typewriter');

        function typeWriter() {
            if (i < message.length) {
                typewriterEl.innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
        window.addEventListener('load', () => {
            setTimeout(typeWriter, 1500);
        });

        // ====== CONFETTI ======
        function burstConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
            setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } }), 200);
            setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } }), 400);
        }

        // ====== FLOATING HEARTS ======
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = Math.random() * 5 + 5 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>

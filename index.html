<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>For You 💖</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('mylove.png') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', cursive;
            overflow: hidden;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* All content above overlay */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        /* Round photo of her */
        .round-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 0 30px rgba(255,105,180,0.7);
            margin-bottom: 25px;
            animation: softBounce 2s infinite;
        }

        @keyframes softBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 3rem;
            color: #ff69b4;
            text-shadow: 0 0 20px #ff1493;
            margin: 10px 0;
        }

        p {
            color: #f8e0e6;
            font-size: 1.2rem;
            margin: 10px 0 20px;
            text-shadow: 1px 1px 3px black;
        }

        input {
            padding: 12px 15px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: 2px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            text-align: center;
            outline: none;
            width: 200px;
            letter-spacing: 3px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        input:focus {
            background: rgba(255,255,255,0.4);
            border-color: #ff69b4;
            box-shadow: 0 0 20px #ff69b4;
        }
        input::placeholder {
            color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
            font-size: 1rem;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: none;
            background: #ff69b4;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #ff1493;
            transition: all 0.3s;
            letter-spacing: 1px;
            font-weight: bold;
        }
        button:hover {
            background: #ff1493;
            transform: scale(1.05);
            box-shadow: 0 0 30px #ff69b4;
        }

        /* Floating birthday wishes container */
        .wishes-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .wish-note {
            position: absolute;
            bottom: -100px;
            font-size: 20px;
            opacity: 0.85;
            animation: floatUp linear infinite;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 8px 16px;
            color: white;
            font-family: 'Georgia', serif;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(15deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background music (starts on user click) -->
    <audio id="bgMusic" loop>
        <source src="http.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Her photo (round) -->
        <img src="love.jpg" alt="My Love" class="round-photo">

        <h1>💖 Welcome, My Love</h1>
        <p>Enter the secret code to see your surprise</p>
        <input type="password" id="pass" placeholder="Password..." autocomplete="off">
        <br>
        <button onclick="check()">Unlock</button>
    </div>

    <!-- Floating birthday wishes -->
    <div class="wishes-container" id="wishesContainer"></div>

    <script>
        // ====== MUSIC (start on first interaction) ======
        const bgMusic = document.getElementById('bgMusic');
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted && bgMusic) {
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => {});
            }
        }

        // Start music when user clicks anywhere, or focuses input
        document.body.addEventListener('click', startMusic, { once: true });
        document.getElementById('pass').addEventListener('focus', startMusic);

        // ====== PASSWORD CHECK ======
        function check() {
            let p = document.getElementById("pass").value;
            if (p === "0119") {
                window.location.href = "unlock.html";
            } else {
                alert("Wrong password 💔");
            }
        }

        // ====== FLOATING BIRTHDAY WISHES ======
        function createWish() {
            const messages = [
                '🎵 ልደትሽ ደስ ይበልሽ!',
                '💌 እንኳን አደረሰሽ!',
                '🎂 መልካም ልደት!',
                '✨ ብሩህ ቀን ይሁንልሽ!',
                '💖 እወድሻለሁ!',
                '🎈 Happy Birthday!',
                '🌟 You are amazing!',
                '💝 Best wishes!',
                '🎊 Melkam Lidet!',
                '💐 Love you always!'
            ];
            const container = document.getElementById('wishesContainer');
            const note = document.createElement('div');
            note.classList.add('wish-note');
            note.innerHTML = messages[Math.floor(Math.random() * messages.length)];
            note.style.left = Math.random() * 80 + 10 + '%';
            note.style.animationDuration = Math.random() * 8 + 6 + 's';
            note.style.fontSize = (Math.random() * 10 + 16) + 'px';
            container.appendChild(note);
            setTimeout(() => note.remove(), 15000);
        }

        // Generate a wish every 2 seconds
        setInterval(createWish, 2000);
        // Create a few immediately
        for (let i = 0; i < 5; i++) {
            setTimeout(createWish, i * 400);
        }
    </script>
</body>
        </html>

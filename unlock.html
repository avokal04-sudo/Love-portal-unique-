<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ❤️</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: url('mylove.png') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', cursive;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .photo-frame, .message, .btn-surprise, .btn-next, .cake-container {
            z-index: 3;
        }

        .sparkles, .hearts-container, .balloons-container, .notes-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            font-size: 20px;
            opacity: 0.8;
            animation: sparkleFloat 3s infinite;
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }

        .photo-frame {
            position: relative;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 0 30px rgba(255,105,180,0.6);
            transition: box-shadow 0.5s;
            z-index: 3;
        }

        .photo-frame.locked img {
            filter: blur(18px) brightness(0.5);
            transition: filter 0.6s ease;
        }

        .photo-frame:not(.locked) img {
            filter: blur(0) brightness(1.1);
            animation: bounce 2s infinite;
            box-shadow: 0 0 40px rgba(255,20,147,0.8);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lock-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('love.jpg') center/cover no-repeat;
            background-color: rgba(255, 105, 180, 0.3);
            background-blend-mode: overlay;
            filter: blur(6px) brightness(0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: 50%;
            transition: opacity 0.6s;
        }

        .lock-icon {
            font-size: 50px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
            filter: none;
            z-index: 6;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .typing-area {
            position: relative;
            margin-bottom: 5px;
            filter: none;
            z-index: 6;
        }

        #secretInput {
            background: rgba(255,255,255,0.6);
            border: 2px solid white;
            font-size: 22px;
            padding: 8px 12px;
            color: #ff1493;
            text-align: center;
            outline: none;
            width: 160px;
            letter-spacing: 4px;
            caret-color: #ff1493;
            border-radius: 8px;
            font-weight: bold;
        }
        #secretInput::placeholder {
            color: rgba(255,20,147,0.6);
            letter-spacing: 1px;
            font-size: 15px;
            font-weight: normal;
        }

        .typed-letters {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px #d63384;
            letter-spacing: 5px;
            pointer-events: none;
            filter: none;
        }

        .unlock-hint {
            color: white;
            font-size: 14px;
            margin-top: 8px;
            text-shadow: 1px 1px 3px black;
            filter: none;
            z-index: 6;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .photo-frame:not(.locked) .lock-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .cake-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3;
        }

        .cake-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .cake {
            font-size: 80px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
            animation: cakeGlow 1.5s infinite alternate;
        }

        @keyframes cakeGlow {
            from { filter: drop-shadow(0 0 15px #ff69b4); }
            to { filter: drop-shadow(0 0 30px #ff1493); }
        }

        .candle {
            position: relative;
            width: 20px;
            height: 40px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            border-radius: 4px 4px 0 0;
            margin-bottom: -10px;
        }

        .wick {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: #333;
            border-radius: 1px;
        }

        .flame {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 24px;
            background: radial-gradient(circle, #fff700, #ff9900, #ff3300);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.15s infinite alternate;
            box-shadow: 0 0 10px #ff9900;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1, 1) rotate(-2deg); opacity: 1; }
            25% { transform: translateX(-50%) scale(1.1, 0.9) rotate(2deg); opacity: 0.9; }
            50% { transform: translateX(-50%) scale(0.9, 1.1) rotate(-1deg); opacity: 0.8; }
            75% { transform: translateX(-50%) scale(1.05, 0.95) rotate(1deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1, 1) rotate(0deg); opacity: 1; }
        }

        .message {
            margin-top: 25px;
            font-size: 2.8rem;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            z-index: 3;
            min-height: 3em;
            font-weight: bold;
            text-align: center;
            /* Visible, but empty initially */
            visibility: visible;
        }

        .btn-surprise, .btn-next {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff6b81;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            z-index: 3;
        }
        .btn-surprise:hover, .btn-next:hover { transform: scale(1.1); background: #fff5f7; }

        .btn-next {
            display: none;
        }

        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.8);
            animation: floatUp linear infinite;
        }

        .note {
            position: absolute;
            bottom: -100px;
            font-size: 22px;
            opacity: 0.9;
            animation: floatUp linear infinite;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 6px 14px;
            color: white;
            font-family: 'Georgia', serif;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .balloon {
            position: absolute;
            bottom: -200px;
            font-size: 40px;
            animation: balloonFloat 8s linear infinite;
            opacity: 0.8;
        }

        @keyframes balloonFloat {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-120vh) rotate(20deg); }
        }
    </style>
</head>
<body>

    <div class="sparkles" id="sparklesContainer"></div>

    <!-- Both pre-lock and post-unlock use the same classical guitar song -->
    <audio id="guitarMusic" loop>
        <source src="Birthday - Happy Birthday Classical Guitar V.mp3" type="audio/mpeg">
    </audio>

    <div class="photo-frame locked" id="photoFrame">
        <img src="love.jpg" alt="Birthday Girl" id="profilePic">
        <div class="lock-overlay" id="lockOverlay">
            <div class="lock-icon" id="lockIcon">🔒</div>
            <div class="typing-area">
                <input type="text" id="secretInput" maxlength="10" placeholder="secret code..." autocomplete="off">
                <div class="typed-letters" id="typedDisplay"></div>
            </div>
            <p class="unlock-hint">Type the secret number to unlock</p>
        </div>
    </div>

    <div class="cake-container" id="cakeContainer">
        <div class="candle">
            <div class="flame"></div>
            <div class="wick"></div>
        </div>
        <div class="cake">🎂</div>
    </div>

    <div class="message" id="typewriter"></div>
    <button class="btn-surprise" onclick="burstConfetti()">🎂 Happy Birthday 🎂</button>
    <button class="btn-next" id="btnNext" onclick="goToLovePage()">💌 Continue to Your Surprise 💌</button>

    <div class="hearts-container" id="heartsContainer"></div>
    <div class="balloons-container" id="balloonsContainer"></div>
    <div class="notes-container" id="notesContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <script>
        const secretWord = "0119";
        let typedWord = "";
        const inputField = document.getElementById('secretInput');
        const typedDisplay = document.getElementById('typedDisplay');
        const lockOverlayEl = document.getElementById('lockOverlay');
        const photoFrameEl = document.getElementById('photoFrame');
        const lockIcon = document.getElementById('lockIcon');
        const cakeContainer = document.getElementById('cakeContainer');
        const guitarMusic = document.getElementById('guitarMusic');
        const btnNext = document.getElementById('btnNext');
        const messageEl = document.getElementById('typewriter');
        let unlocked = false;
        let musicStarted = false;

        // Try to start music when user clicks the input field (browser requires user gesture)
        function startMusic() {
            if (!musicStarted && guitarMusic) {
                guitarMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => {});
            }
        }

        inputField.addEventListener('focus', startMusic);
        inputField.addEventListener('click', startMusic);
        // Also try on whole document first interaction (safety)
        document.body.addEventListener('click', startMusic, { once: true });

        window.addEventListener('load', () => {
            inputField.focus();
            createBackgroundSparkles();
            startFloatingHearts();
            startFloatingBalloons();
            startFloatingNotes();
        });

        inputField.addEventListener('input', (e) => {
            if (unlocked) return;
            const currentInput = e.target.value.toLowerCase();
            typedWord = currentInput;
            typedDisplay.textContent = typedWord;

            if (typedWord === secretWord) {
                unlocked = true;
                photoFrameEl.classList.remove('locked');
                lockIcon.textContent = '❤️';
                typedDisplay.textContent = '❤️❤️❤️';
                // Guitar music already playing, just keep it going (don't stop/restart)
                // Start the typing message
                startTypewriter();
                setTimeout(() => {
                    lockOverlayEl.style.display = 'none';
                }, 600);
                setTimeout(() => {
                    cakeContainer.classList.add('show');
                }, 400);
                burstConfetti();
                createExtraSparkles();
                setTimeout(() => {
                    btnNext.style.display = 'inline-block';
                }, 1200);
            }
        });

        const messageText = "Happy Birthday, My Love! ❤️";
        const speed = 100;
        let i = 0;

        function startTypewriter() {
            messageEl.innerHTML = ''; // clear any existing
            i = 0;
            function type() {
                if (i < messageText.length) {
                    messageEl.innerHTML += messageText.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function burstConfetti() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } }), 200);
            setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } }), 400);
        }

        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = ['❤️','💕','💖','💘','💝'][Math.floor(Math.random()*5)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = Math.random() * 5 + 5 + 's';
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                document.getElementById('heartsContainer').appendChild(heart);
                setTimeout(() => heart.remove(), 10000);
            }, 400);
        }

        function startFloatingBalloons() {
            const emojis = ['🎈','🎈','🎈','🎊','🎉'];
            setInterval(() => {
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');
                balloon.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
                balloon.style.left = Math.random() * 100 + '%';
                balloon.style.animationDuration = Math.random() * 6 + 6 + 's';
                document.getElementById('balloonsContainer').appendChild(balloon);
                setTimeout(() => balloon.remove(), 12000);
            }, 1500);
        }

        function startFloatingNotes() {
            const messages = [
                '🎵 ልደትሽ ደስ ይበልሽ!',
                '💌 እንኳን አደረሰሽ!',
                '🎂 መልካም ልደት!',
                '✨ ብሩህ ቀን ይሁንልሽ!',
                '💖 እወድሻለሁ እንደመጀመሪያው',
                '🎈 Happy Birthday!',
                '🌟 You are special!',
                '💝 Love you forever!'
            ];
            setInterval(() => {
                const note = document.createElement('div');
                note.classList.add('note');
                note.innerHTML = messages[Math.floor(Math.random() * messages.length)];
                note.style.left = Math.random() * 80 + 10 + '%';
                note.style.animationDuration = Math.random() * 8 + 6 + 's';
                note.style.fontSize = (Math.random() * 10 + 18) + 'px';
                document.getElementById('notesContainer').appendChild(note);
                setTimeout(() => note.remove(), 15000);
            }, 2500);
        }

        function createBackgroundSparkles() {
            const container = document.getElementById('sparklesContainer');
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.innerHTML = '✨';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDuration = Math.random() * 4 + 3 + 's';
                sparkle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(sparkle);
            }
        }

        function createExtraSparkles() {
            const container = document.getElementById('sparklesContainer');
            for (let i = 0; i < 15; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.innerHTML = '✨';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDuration = Math.random() * 2 + 2 + 's';
                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 3000);
            }
        }

        function goToLovePage() {
            window.location.href = "love.html";
        }
    </script>
</body>
    </html>

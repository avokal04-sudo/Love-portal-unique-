<!DOCTYPE html>
<html>
<head>
  <title>Unlocked ❤️</title>
  <style>
    body {
      text-align: center;
      background: black;
      color: pink;
      font-family: Arial;
    }

    h1 {
      margin-top: 50px;
    }

    .heart {
      font-size: 40px;
      animation: float 2s infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body>

  <h1>🎉 Welcome My Love ❤️</h1>

  <p>I love you forever 💖</p>

  <div class="heart">💖💖💖</div>

  <!-- MUSIC -->
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <!-- IMAGE -->
  <img src="love.jpg" width="250">

</body>
</html>
